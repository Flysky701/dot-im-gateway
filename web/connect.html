<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dot · 连接私聊渠道</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <header class="top">
    <span class="brand">dot</span>
    <span class="badge" id="mode-badge">本机临时连接</span>
  </header>
  <h1>连接私聊渠道</h1>

  <form id="setup">
    <div class="channels">
      <label>
        <input type="radio" name="platform" value="qq" checked>
        <strong>QQ</strong>
        <small>仅文字</small>
      </label>
      <label>
        <input type="radio" name="platform" value="weixin">
        <strong>微信</strong>
        <small id="weixin-cap">仅文字</small>
      </label>
    </div>

    <details id="qq-advanced" class="compact">
      <summary>备用：手填凭据 / 限定 AppID</summary>
      <label>
        <span>连接方式</span>
        <select name="qqAuth">
          <option value="qr" selected>官方扫码（推荐）</option>
          <option value="manual">手填 AppID + Secret</option>
        </select>
      </label>
      <label>
        <span id="appid-caption">限定 AppID（可选）</span>
        <input name="appId" autocomplete="off" maxlength="128" placeholder="留空则在手机端选择">
      </label>
      <label id="secret-field" hidden>
        <span>AppSecret</span>
        <input name="secret" type="password" autocomplete="off" maxlength="1024">
      </label>
      <p class="links"><a href="https://q.qq.com/" target="_blank" rel="noopener noreferrer">QQ 机器人控制台 ↗</a></p>
    </details>

    <details open id="tunnel-fields">
      <summary id="tunnel-summary">OpenAI Tunnel</summary>
      <label>
        <span class="label-row">
          <span>Tunnel ID</span>
          <a href="https://platform.openai.com/settings/organization/tunnels" target="_blank" rel="noopener noreferrer">查看 Tunnel ↗</a>
        </span>
        <input name="tunnelId" autocomplete="off" placeholder="tunnel_..." required maxlength="128">
      </label>
      <label>
        <span class="label-row">
          <span>组织 ID</span>
          <a href="https://platform.openai.com/settings/organization/general" target="_blank" rel="noopener noreferrer">查看组织 ↗</a>
        </span>
        <input name="organizationId" autocomplete="off" placeholder="org-..." required maxlength="128">
      </label>
      <label>
        <span class="label-row">
          <span>运行密钥（Tunnels Read+Use）</span>
          <a href="https://platform.openai.com/settings/organization/api-keys" target="_blank" rel="noopener noreferrer">创建密钥 ↗</a>
        </span>
        <input name="runtimeKey" type="password" autocomplete="off" placeholder="仅粘贴于此，不发聊天" required maxlength="1024">
      </label>
    </details>

    <label class="consent">
      <input name="confirmed" type="checkbox" required>
      <span id="consent-text">仅连接本人私聊，关闭终端即断开</span>
    </label>
    <button id="connect" type="submit">开始连接</button>
  </form>

  <section id="flow" hidden>
    <div class="step" id="step" role="status">正在连接…</div>
    <p id="instruction"></p>
    <pre id="challenge" hidden></pre>
    <button id="copy-challenge" class="quiet" type="button" data-copy="challenge" hidden>复制验证文字</button>
    <img id="qr" alt="请用本人微信扫描" hidden>
    <form id="confirm" hidden>
      <label id="confirm-label" for="answer">确认</label>
      <input id="answer" autocomplete="off" required maxlength="300">
      <button>确认继续</button>
    </form>
    <button id="approve-app" type="button" hidden>确认使用此机器人</button>
    <div id="handed" hidden>
      <p class="ok-note">后台服务已启动，支持断线重连与开机自启。</p>
      <p id="linger-warning" class="warn" hidden>未开启 linger，退出 SSH 可能停服：<code>sudo loginctl enable-linger $USER</code></p>
      <label for="dot-prompt">最后一步：发给已添加插件的原 dot<textarea id="dot-prompt" readonly rows="5"></textarea></label>
      <button class="quiet" type="button" data-copy="dot-prompt">复制给 dot 的指令</button>
    </div>
    <div id="complete" hidden>
      <p class="ok-note">在 ChatGPT 让 dot 读取并回复一条私聊消息，手机收到即完成。</p>
      <button id="finish" type="button">关闭此页面</button>
    </div>
    <button id="stop" class="quiet" type="button">停止本次连接</button>
  </section>

  <p id="error" role="alert"></p>
</main>
</body>
</html>
