name: release
# Tags create a draft. Manual runs can build binaries for a draft or append
# missing assets to an existing published release without replacing its files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.2
        required: true
      build_binaries:
        description: Build Windows and Linux executables
        type: boolean
        default: false
      attach_to_published:
        description: Append binaries to an existing published release
        type: boolean
        default: false
permissions:
  contents: read
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  verify:
    if: ${{ !inputs.attach_to_published }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm ci --offline --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s test -p '*_test.py'
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Never touch a published release: a rerun may only refill a draft.
      - name: Create draft release, or refuse if already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$draft" != true ]; then echo "::error::$TAG is already published; bump the version and tag again instead of rebuilding"; exit 1; fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "Source release for $TAG. See README.md for usage and docs/THIRD_PARTY_NOTICES.md for dependency licensing."
          fi
  build:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.build_binaries && (needs.draft.result == 'success' || inputs.attach_to_published) }}
    needs: draft
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$TAG"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
      - run: npm ci --prefix packaging --ignore-scripts --no-audit --no-fund
      - run: python packaging/fetch.py
      - run: node packaging/build.js
      # build.js already runs --self-test and writes <file>.sha256 and <file>.build.json.
      - name: Verify checksums
        shell: bash
        run: |
          cd dist
          for f in *.sha256; do sha256sum -c "$f"; done
          ls -l
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACH_TO_PUBLISHED: ${{ inputs.attach_to_published }}
        run: |
          draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
          if [ "$ATTACH_TO_PUBLISHED" = true ]; then
            test "$draft" = false
            gh release upload "$TAG" dist/dot-im-connect-* -R "$GITHUB_REPOSITORY"
          else
            if [ "$draft" != true ]; then echo "::error::$TAG is already published"; exit 1; fi
            gh release upload "$TAG" dist/dot-im-connect-* -R "$GITHUB_REPOSITORY" --clobber
          fi
