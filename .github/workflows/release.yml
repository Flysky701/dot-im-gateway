name: release
# Tags create a tested source-only DRAFT release. Portable binaries require an
# explicit manual build after the maintainer reviews third-party redistribution
# permissions. Review the draft before publishing; server-bootstrap.sh only
# downloads published assets and verifies the .sha256 file and source commit before use.
# A published release is never modified: rerunning for it fails instead of overwriting.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.1
        required: true
      build_binaries:
        description: Build private draft binaries (review third-party redistribution permission first)
        type: boolean
        default: false
permissions:
  contents: read
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm ci --offline --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s test -p '*_test.py'
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Never touch a published release: a rerun may only refill a draft.
      - name: Create draft release, or refuse if already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$draft" != true ]; then echo "::error::$TAG is already published; bump the version and tag again instead of rebuilding"; exit 1; fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "Source release for $TAG. See README.md for usage and docs/THIRD_PARTY_NOTICES.md for dependency licensing."
          fi
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_binaries
    needs: draft
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci --prefix packaging --ignore-scripts --no-audit --no-fund
      - run: python packaging/fetch.py
      - run: node packaging/build.js
      # build.js already runs --self-test and writes <file>.sha256 and <file>.build.json.
      - name: Verify checksums
        shell: bash
        run: |
          cd dist
          for f in *.sha256; do sha256sum -c "$f"; done
          ls -l
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-check right before uploading: the draft may have been published meanwhile.
          draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
          if [ "$draft" != true ]; then echo "::error::$TAG was published during the build; not overwriting its assets"; exit 1; fi
          gh release upload "$TAG" dist/dot-im-connect-* -R "$GITHUB_REPOSITORY" --clobber
